apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: vnc-plugin-template
  annotations:
    openshift.io/display-name: VNC Plugin Template
    openshift.io/documentation-url: 'https://github.com/rszwajko/vnc-plugin'
    iconClass: icon-nginx
    tags: openshift,console,plugin,vnc
message: >-
  To enable the plugin on the cluster, run the following command:
  oc patch consoles.operator.openshift.io cluster --patch '{ "spec": { "plugins": ["${PLUGIN_NAME}"] } }' --type=merge
  For more information about using this template, see https://github.com/rszwajko/vnc-plugin
objects:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: '${NAMESPACE}'
      labels:
        app: '${PLUGIN_NAME}'
        app.kubernetes.io/part-of: '${PLUGIN_NAME}'
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: '${PLUGIN_NAME}'
      namespace: '${NAMESPACE}'
      labels:
        app: '${PLUGIN_NAME}'
        app.kubernetes.io/component: '${PLUGIN_NAME}'
        app.kubernetes.io/instance: '${PLUGIN_NAME}'
        app.kubernetes.io/part-of: '${PLUGIN_NAME}'
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: '${PLUGIN_NAME}'
      namespace: '${NAMESPACE}'
      labels:
        app: '${PLUGIN_NAME}'
        app.kubernetes.io/component: '${PLUGIN_NAME}'
        app.kubernetes.io/instance: '${PLUGIN_NAME}'
        app.kubernetes.io/part-of: '${PLUGIN_NAME}'
        app.openshift.io/runtime-namespace: '${NAMESPACE}'
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: '${PLUGIN_NAME}'
      template:
        metadata:
          annotations:
            target.workload.openshift.io/management: |
              {"effect": "PreferredDuringScheduling"}
          labels:
            app: '${PLUGIN_NAME}'
        spec:
          serviceAccountName: '${PLUGIN_NAME}'
          containers:
            - name: '${PLUGIN_NAME}'
              image: '${IMAGE}'
              ports:
                - containerPort: 9443
                  protocol: TCP
              imagePullPolicy: Always
              resources:
                requests:
                  cpu: 10m
                  memory: 50Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
              readinessProbe:
                tcpSocket:
                  port: 9443
                initialDelaySeconds: 10
                periodSeconds: 10
              livenessProbe:
                tcpSocket:
                  port: 9443
                initialDelaySeconds: 10
                periodSeconds: 10
                timeoutSeconds: 1
                successThreshold: 1
                failureThreshold: 3
              terminationMessagePolicy: FallbackToLogsOnError
              volumeMounts:
                - name: vnc-plugin-serving-cert
                  readOnly: true
                  mountPath: /var/serving-cert
                - name: nginx-conf
                  readOnly: true
                  mountPath: /etc/nginx/nginx.conf
                  subPath: nginx.conf
          volumes:
            - name: vnc-plugin-serving-cert
              secret:
                secretName: vnc-plugin-serving-cert
                defaultMode: 420
            - name: nginx-conf
              configMap:
                name: nginx-conf
                defaultMode: 420
          restartPolicy: Always
          dnsPolicy: ClusterFirst
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 25%
          maxSurge: 25%
  - apiVersion: v1
    kind: Service
    metadata:
      annotations:
        service.alpha.openshift.io/serving-cert-secret-name: vnc-plugin-serving-cert
      name: '${PLUGIN_NAME}'
      namespace: '${NAMESPACE}'
      labels:
        app: '${PLUGIN_NAME}'
        app.kubernetes.io/component: '${PLUGIN_NAME}'
        app.kubernetes.io/instance: '${PLUGIN_NAME}'
        app.kubernetes.io/part-of: '${PLUGIN_NAME}'
    spec:
      ports:
        - name: 9443-tcp
          protocol: TCP
          port: 9443
          targetPort: 9443
      selector:
        app: '${PLUGIN_NAME}'
      type: ClusterIP
      sessionAffinity: None
  - apiVersion: console.openshift.io/v1
    kind: ConsolePlugin
    metadata:
      name: '${PLUGIN_NAME}'
    spec:
      displayName: 'VNC plugin'
      backend:
        type: Service
        service:
          name: '${PLUGIN_NAME}'
          namespace: '${NAMESPACE}'
          port: 9443
          basePath: '/'
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: nginx-conf
      namespace: '${NAMESPACE}'
      labels:
        app: '${PLUGIN_NAME}'
        app.kubernetes.io/part-of: '${PLUGIN_NAME}'
    data:
      nginx.conf: |
        error_log /dev/stdout info;
        events {}
        http {
          access_log         /dev/stdout;
          include            /etc/nginx/mime.types;
          default_type       application/octet-stream;
          keepalive_timeout  65;
          server {
            listen              [::]:9443 ipv6only=off ssl;
            ssl_certificate     /var/serving-cert/tls.crt;
            ssl_certificate_key /var/serving-cert/tls.key;
            root                /usr/share/nginx/html;
          }
        }
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: 'allow-plugin-${PLUGIN_NAME}-ingress'
      namespace: '${NAMESPACE}'
    spec:
      podSelector:
        matchLabels:
          app: '${PLUGIN_NAME}'
      ingress:
        - ports:
            - protocol: TCP
              port: 9443
      policyTypes:
        - Ingress
parameters:
  - description: Name of your plugin. This name must match the name in the consolePlugin declaration in package.json.
    name: PLUGIN_NAME
    value: vnc-plugin
    required: true
  - description: Namespace for your plugin. The namespace will be created by the template.
    name: NAMESPACE
    value: vnc-plugin
    required: true
  - description: Container image of the plugin.
    name: IMAGE
    value: quay.io/rszwajko/vnc-plugin:latest
    required: true
